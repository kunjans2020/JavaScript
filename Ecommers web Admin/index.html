<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ecom-Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="d-flex flex-column gap-3 m-3">
        <h2>Product Listing</h2>
        <input
          id="input-name"
          type="text"
          class="form-control"
          placeholder="Product Name.."
        />
        <input
          id="input-category"
          type="text"
          class="form-control"
          placeholder="Category"
        />
        <input
          id="input-price"
          type="text"
          class="form-control"
          placeholder="Price"
        />
        <input
          id="input-discount"
          type="text"
          class="form-control"
          placeholder="Discount"
        />
        <input
          id="input-description"
          type="text"
          class="form-control"
          placeholder="Description"
        />
        <input
          id="input-rating"
          type="text"
          class="form-control"
          placeholder="Rating"
        />
        <input
          id="input-image"
          type="text"
          class="form-control"
          placeholder="Product URL"
        />
        <button id="add-product-btn" class="btn btn-primary">
          Add Product
        </button>
        <button id="edit-product-btn" class="btn btn-warning d-none">
          Edit Product
        </button>
      </div>
    </div>
    <hr />
    <div class="container my-5 d-flex align-items-center gap-3">
      <div class="d-flex gap-3 col-4">
        <input
          id="input-search"
          type="text"
          placeholder="search here.."
          class="form-control"
        />
        <button id="search-btn" class="btn btn-primary">Search</button>
        <button id="reset-btn" class="btn btn-primary">Reset</button>
      </div>
      <div>
        <div class="dropdown">
          <a
            class="form-control dropdown-toggle border border-1 border-secondary px-5 py-2 rounded text-decoration-none text-muted"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            All Products
          </a>

          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Food & Beverage</a></li>
            <li><a class="dropdown-item" href="#">Clothes</a></li>
            <li><a class="dropdown-item" href="#">Grocery</a></li>
            <li><a class="dropdown-item" href="#">Beauty</a></li>
            <li><a class="dropdown-item" href="#">Vegetables</a></li>
            <li><a class="dropdown-item" href="#">Fruits</a></li>
            <li><a class="dropdown-item" href="#">Electronics</a></li>
          </ul>
        </div>
      </div>
      <div>
        <!-- <div class="dropdown">
          <a
            class="form-control dropdown-toggle border border-1 border-secondary px-5 py-2 rounded text-decoration-none text-muted"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Sort by Price
          </a>

          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Higher to Lower</a></li>
            <li><a class="dropdown-item" href="#">Lower to Higher</a></li>
          </ul>
        </div> -->

        <select class="p-2 rounded" name="" id="price-filter">
          <option value="default">Default</option>
          <option value="max">Higher to Lower</option>
          <option value="min">Lower to Higher</option>
        </select>
      </div>
    </div>
    <div class="container">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Preview</th>
            <th scope="col">Product Name</th>
            <th scope="col">Category</th>
            <th scope="col">Description</th>
            <th scope="col">Price</th>
            <th scope="col">Discount</th>
            <th scope="col">Rating</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody id="product-tbody"></tbody>
      </table>
    </div>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
