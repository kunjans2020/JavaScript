<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Digital Clock</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="clock-container">
      <!-- CITY -->

      <div class="city" id="city">📍 Surat, Gujarat</div>

      <!-- TIME -->

      <div class="time" id="time">12:00:00</div>

      <!-- AM PM -->

      <div class="ampm" id="ampm">AM</div>

      <!-- DATE -->

      <div class="date" id="date">Monday, 01 January 2026</div>

      <!-- WEATHER -->

      <div class="weather">
        <div class="weather-icon" id="weatherIcon">🌤️</div>

        <div>
          <div class="temperature" id="temperature">--°C</div>

          <div class="condition" id="condition">Loading weather...</div>
        </div>
      </div>

      <div class="error" id="error"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
