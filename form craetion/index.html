<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form creation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <div class="form-box">
        <input id="input-name" type="text" placeholder="Enter name" />
        <input id="input-email" type="email" placeholder="Enter email" />
        <input id="input-phone" type="number" placeholder="Enter phone" />
        <input id="input-age" type="number" placeholder="Enter age" />
        <button id="submit-btn" type="submit">Submit</button>
        <p id="output-name"></p>
        <p id="output-email"></p>
        <p id="output-phone"></p>
        <p id="output-age"></p>
      </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
